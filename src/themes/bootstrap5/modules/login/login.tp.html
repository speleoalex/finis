<div class="container-fluid" >
    <h3>{i18n:Login}</h3>
    <form role="form"  action="{formaction}" method="post" name="login" >
        <input class="form-control mb-2" placeholder="{i18n:Username}" name="username" type="text" autocomplete="username" >
        <input  class="form-control mb-2" name="password" type="password" placeholder="Password" autocomplete="current-password">
        <!-- captcha -->
        {i18n:Enter this security code}:<br />
        {htmlcaptcha}
        <!-- end captcha -->
        <!-- rememberlogin -->
        <div><input type="checkbox" name="rememberlogin" value="1" />&nbsp;{i18n:Stay connected}</div>
        <!-- endrememberlogin -->
        <br />
        <button type="submit" class="btn btn-primary">{i18n:Login}</button>
        <!-- register -->
        <a class="btn btn-primary" href="{urlregister}">{i18n:Register}</a>
        <!-- end register -->
        <!-- passwordrecovery -->
        <a href="{urlpasswordrecovery}" >{i18n:Password recovery}</a>
        <!-- end passwordrecovery -->
        <!-- loginerror --><br /><br /><div class="alert alert-danger" >{login_error}</div><!-- end loginerror -->
    </form>

    <!-- if {oauth_providers} -->
    <hr />
    <!-- end if {oauth_providers} -->
    <!-- foreach {oauth_providers} -->
    <a class="btn btn-outline-secondary" href="{url}"><!-- if {urlimage} --><img style="max-height:30px;"
            src="{urlimage}" /> <!-- end if {urlimage} -->{i18n:Continue with}: {name}</a>
    <!-- end foreach {oauth_providers} -->
</div>
