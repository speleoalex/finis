<form enctype="multipart/form-data" action="{formaction}" method="post" name="register">
    <h3>{i18n:Register}:</h3>
    <!-- contents -->
    <!-- group -->
    <div class="fw-bold border-bottom mt-3 mb-2">{groupname}</div>
    <!-- end_group -->
    <!-- item -->
    <div class="mb-3">
        <label class="form-label" for="{fieldname}">{title}<!-- error --><span
                class="text-danger d-block">{error}</span><!-- end_error --></label>
        <!-- inputattributes radio:class="form-check-input" -->
        <!-- inputattributes check:class="form-check-input" -->
        <!-- inputattributes:class="form-control" -->{input}
    </div>
    <!-- end_item -->
    <!-- endgroup -->
    <!-- end_endgroup -->
    <!-- end_contents -->

    <!-- conditions -->
    <div class="mb-3">
        {htmlconditions}
    </div>
    <!-- endconditions -->
    <!-- captcha -->
    <div class="mb-3">
        <label class="form-label">{i18n:Enter this security code}:</label><br />
        {htmlcaptcha} <span class="text-danger">{txt_error_security_code}</span>
    </div>
    <!-- endcaptcha -->
    <div class="d-flex flex-wrap gap-2">
        <input name="updateuser" value="1" type="hidden" />
        <button class="btn btn-info" type="submit">{i18n:Save}</button>
        <button class="btn btn-secondary" type="button" onclick="window.location = '{urlcancel}'">{i18n:Cancel}</button>
    </div>
</form>
