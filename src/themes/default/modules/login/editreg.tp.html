<form enctype="multipart/form-data"  action="{formaction}" method="post" name="register" >
    <h2>{i18n:Edit profile}:</h2>
    <table class="table" >
        <!-- contents -->
        <!-- group -->
        <tr><td colspan="2" style="text-align:center"><b>{groupname}</b></td></tr>
        <!-- end_group -->
        <!-- item -->
        <tr>
            <td valign="top">{title}<!-- error --><span style="color:red"><br />{error}</span><!-- end_error --></td>
            <td valign="top">{input}</td>
        </tr>
        <!-- end_item -->
        <!-- endgroup -->
        <!-- end_endgroup -->
        <!-- end_contents -->
        <!-- if {apikey} -->
        <tr>
            <td valign="top">{i18n:API key}</td>
            <td valign="top">
                <input type="text" class="form-control" readonly="readonly" value="{apikey}" onclick="this.select()" />
                <br /><small>{i18n:MCP endpoint}: <code>{mcp_url}</code></small>
                <br /><button class="btn btn-secondary btn-sm" type="submit" name="regenerate_apikey" value="1" onclick="return confirm('{i18n:regenerate the API key? The clients that use the current key will stop working}')">{i18n:Regenerate API key}</button>
                <!-- if {apikey_message} --><span style="color:green">{apikey_message}</span><!-- end if {apikey_message} -->
            </td>
        </tr>
        <!-- end if {apikey} -->
        <tr>
            <td colspan="2" style="text-align: center">
                <input name="updateuser" value="1" type="hidden" />
                <button class="btn btn-primary" type="submit">{i18n:Save}</button>
                <button class="btn btn-secondary" type="button" onclick="window.location = '{urlcancel}'">{i18n:Cancel}</button>
            </td>
        </tr>
    </table>
</form>
