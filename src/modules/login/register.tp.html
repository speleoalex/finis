<style>
    /* framework fallback layout: no css framework required, mobile first */
    .fnregister {
        max-width: 34rem;
        margin: 0 auto;
    }

    .fnregister-group {
        font-weight: bold;
        border-bottom: 1px solid #ccc;
        margin: 1em 0 0.5em;
    }

    .fnregister-field {
        margin-bottom: 1em;
    }

    .fnregister-field > label {
        display: block;
        margin-bottom: 0.25em;
    }

    /* the inputs are generated by the form engine: keep them inside the screen */
    .fnregister-field input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
    .fnregister-field select,
    .fnregister-field textarea,
    .fnregister-field table {
        width: 100%;
        box-sizing: border-box;
    }

    .fnregister-error {
        display: block;
        color: red;
    }

    .fnregister-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
    }
</style>
<form enctype="multipart/form-data" action="{formaction}" method="post" name="register" class="fnregister">
    <h2>{i18n:Register}:</h2>
    <!-- contents -->
    <!-- group -->
    <div class="fnregister-group">{groupname}</div>
    <!-- end_group -->
    <!-- item -->
    <div class="fnregister-field">
        <label for="{fieldname}">{title}<!-- error --><span
                class="fnregister-error">{error}</span><!-- end_error --></label>
        {input}
    </div>
    <!-- end_item -->
    <!-- endgroup -->
    <!-- end_endgroup -->
    <!-- end_contents -->
    <!-- conditions -->
    <div class="fnregister-field">
        {htmlconditions}
    </div>
    <!-- endconditions -->
    <!-- captcha -->
    <div class="fnregister-field">
        <label>{i18n:Enter this security code}:</label>
        {htmlcaptcha} <span class="fnregister-error">{txt_error_security_code}</span>
    </div>
    <!-- endcaptcha -->
    <div class="fnregister-actions">
        <input name="updateuser" value="1" type="hidden" />
        <button type="submit">{i18n:Save}</button>
        <button type="button" onclick="window.location = '{urlcancel}'">{i18n:Cancel}</button>
    </div>
</form>
