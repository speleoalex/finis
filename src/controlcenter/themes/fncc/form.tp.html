<section class="fncc-card">
    <div class="fncc-card__body">
        <!-- if {text_on_update_ok} -->
        <div class="fncc-alert fncc-alert--success">{text_on_update_ok}</div>
        <!-- end if {text_on_update_ok} -->
        <!-- if {text_on_update_fail} -->
        <div class="fncc-alert fncc-alert--danger" role="alert">{text_on_update_fail}</div>
        <!-- end if {text_on_update_fail} -->
        <!-- if {text_on_insert_ok} -->
        <div class="fncc-alert fncc-alert--success">{text_on_insert_ok}</div>
        <!-- end if {text_on_insert_ok} -->

        <form method="post" action="{action}" enctype="multipart/form-data" onchange="set_changed();">
            <!-- contents -->
            <!-- group -->
            <fieldset><legend>{groupname}</legend>
                <!-- end_group -->
                <!-- item -->
                <div class="fncc-field">
                    <label for="{fieldname}">{title}</label>
                    <!-- error --><span class="fncc-field__error">{error}</span><!-- end_error -->
                    {input}
                    <!-- if {help} --><span class="fncc-field__hint">{help}</span><!-- end if {help} -->
                </div>
                <!-- end_item -->
                <!-- item_type_check -->
                <div class="fncc-field">
                    <label for="{fieldname}">{title}</label>
                    <!-- error --><span class="fncc-field__error">{error}</span><!-- end_error -->
                    {input}
                    <!-- if {help} --><span class="fncc-field__hint">{help}</span><!-- end if {help} -->
                </div>
                <!-- end_item_type_check -->
                <!-- item_type_radio -->
                <div class="fncc-field">
                    <label for="{fieldname}">{title}</label>
                    <!-- error --><span class="fncc-field__error">{error}</span><!-- end_error -->
                    {input}
                    <!-- if {help} --><span class="fncc-field__hint">{help}</span><!-- end if {help} -->
                </div>
                <!-- end_item_type_radio -->
                <!-- endgroup -->
            </fieldset>
            <!-- end_endgroup -->
            <!-- end_contents -->

            <div>{html_on_insert}</div>

            <div class="fncc-toolbar">
                <button class="fncc-btn fncc-btn--primary" type="submit">{textsave}</button>
                <!-- if {textcancel} -->
                <a class="fncc-btn" href="{url_cancel}">{textviewlist}</a>
                <!-- end if {textcancel} -->
            </div>
        </form>
    </div>
</section>
