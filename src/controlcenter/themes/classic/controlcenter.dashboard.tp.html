<!DOCTYPE html>
<html lang="{lang}">
    <head>
        <!-- include FN_HtmlHeader -->
        <title></title>
        <!-- end include FN_HtmlHeader -->
        <meta charset="{charset_page}" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        {cc_assets}
        <script>
            (function () {
                try {
                    var mode = window.localStorage.getItem("fncc-theme");
                    if (mode === "light" || mode === "dark") {
                        document.documentElement.setAttribute("data-fncc-theme", mode);
                    }
                } catch (e) { /* storage blocked: keep the system palette */ }
            }());
        </script>
    </head>
    <body class="fncl">
        <a class="fncc-skip" href="#fncc-content">{i18n:Skip to content}</a>

        <header class="fncl-top">
            <div class="fncl-top__bar">
                <a class="fncl-brand" href="{siteurl}index.php?fnapp=controlcenter">
                    <!-- if {url_logo} -->
                    <img src="{url_logo}" alt="" />
                    <!-- end if {url_logo} -->
                    <span>
                        <strong>{sitename}</strong>
                        <span>{i18n:Control center}</span>
                    </span>
                </a>
                <div class="fncl-top__actions">
                    <button type="button" class="fncc-btn fncc-btn--quiet fncc-btn--sm" data-fncc-theme-toggle
                            data-label-auto="{i18n:Automatic theme}" data-label-light="{i18n:Light theme}" data-label-dark="{i18n:Dark theme}">
                        <span data-fncc-theme-label>{i18n:Automatic theme}</span>
                    </button>
                    <span class="fncl-langs"><!-- include languages --><!-- langitem --><a href="?fnapp=controlcenter&amp;lang={langname}">{langname}</a><!-- endlangitem --><!-- end include languages --></span>
                    <a class="fncc-btn fncc-btn--sm" href="{siteurl}" target="_blank" rel="noopener">&#x2197; {i18n:Go to} {sitename}</a>
                    <a class="fncc-btn fncc-btn--sm" href="{siteurl}?fnapp=controlcenter&amp;fnlogin=logout">{i18n:Exit}</a>
                </div>
            </div>
        </header>

        <main id="fncc-content" class="fncl-content">
            <!-- Everything the panel can do, laid out as cards: this is the page
                 that opens on the way in, so the groups are all in sight. -->
            <!-- foreach {menuitems} -->
            <section class="fncc-card fncl-home__group">
                <div class="fncc-card__header"><h2>{title}</h2></div>
                <div class="fncc-card__body">
                    <ul class="fncl-home__items">
                        <!-- foreach {sections} -->
                        <li>
                            <a class="fncl-home__item" href="{link}" title="{description}">
                                <!-- if {icon_mask} --><span class="fncl-ico fncl-ico--big" style="{icon_style}" aria-hidden="true"></span><!-- end if {icon_mask} -->
                                <!-- if not {icon_mask} --><img class="fncl-ico fncl-ico--big fncl-ico--raster" src="{image}" alt="" /><!-- end if not {icon_mask} -->
                                <span>{title}</span>
                            </a>
                        </li>
                        <!-- end foreach {sections} -->
                    </ul>
                </div>
            </section>
            <!-- end foreach {menuitems} -->

            <!-- include dashboard -->
            <section class="fncc-card">
                <div class="fncc-card__header"><h2>{dashboard_title}</h2></div>
                <div class="fncc-card__body">{dashboard_contents}</div>
            </section>
            <!-- end include dashboard -->
        </main>
    </body>
</html>
