<section class="fncc-card">
    <div class="fncc-card__body">
        <div class="fncc-tablewrap">
            <table class="fncc-table fncc-table--stack">
                <tbody>
                    <!-- contents -->
                    <!-- group -->
                    <!-- end_group -->
                    <!-- item -->
                    <tr>
                        <th scope="row">{title}</th>
                        <td data-label="{title}">{input}</td>
                    </tr>
                    <!-- end_item -->
                    <!-- endgroup -->
                    <!-- end_endgroup -->
                    <!-- end_contents -->
                </tbody>
            </table>
        </div>
        <div class="fncc-toolbar">
            <!-- if {textviewlist} -->
            <a class="fncc-btn fncc-btn--primary" href="{link_view_list}">{textviewlist}</a>
            <!-- end if {textviewlist} -->
            <button class="fncc-btn" type="button" onclick="window.print();">{i18n:Print}</button>
        </div>
    </div>
</section>
