<!-- if {filters} -->
<section class="fncc-card">
    <header class="fncc-card__header">{i18n:Filter}</header>
    <div class="fncc-card__body">
        <form method="{method}" action="{actionfilters}">
            <div class="fncc-grid">
                <!-- foreach {filters} -->
                <!-- if not {options} -->
                <div class="fncc-field">
                    <label for="fnccfilter_{name}">{title}</label>
                    <input id="fnccfilter_{name}" type="text" name="{name}" value="{value}" />
                </div>
                <!-- end if not {options} -->
                <!-- if {options} -->
                <div class="fncc-field">
                    <label for="fnccfilter_{name}">{title}</label>
                    <select id="fnccfilter_{name}" name="{name}" data-value="{value}">
                        <option value=""></option>
                        <!-- foreach {options} -->
                        <!-- if {selected} -->
                        <option value="{value}" selected="selected">{title}</option>
                        <!-- end if {selected} -->
                        <!-- if not {selected} -->
                        <option value="{value}">{title}</option>
                        <!-- end if not {selected} -->
                        <!-- end foreach {options} -->
                    </select>
                </div>
                <!-- end if {options} -->
                <!-- end foreach {filters} -->
            </div>
            <div class="fncc-toolbar">
                <button class="fncc-btn fncc-btn--primary" type="submit">{i18n:Search}</button>
                <a class="fncc-btn" href="{urlreset}">{i18n:Reset}</a>
            </div>
        </form>
    </div>
</section>
<!-- end if {filters} -->

<section class="fncc-card">
    <header class="fncc-card__header">
        <!-- if {enablenew} -->
        <a class="fncc-btn fncc-btn--primary" href="{urlnewrecord}">{textnew}</a>
        <!-- end if {enablenew} -->
        <!-- if {enableexport} -->
        <a class="fncc-btn" href="{urlexport}">{textexport}</a>
        <!-- end if {enableexport} -->
        <span class="fncc-toolbar__spacer"></span>
        <span class="fncc-badge">{txt_num_records}</span>
    </header>
    <div class="fncc-card__body">

        <nav class="fncc-toolbar" aria-label="{i18n:Pages}">
            <!-- if {nav_page_first} -->
            <a class="fncc-btn fncc-btn--sm" href="{link}" title="{i18n:First page}">&laquo;</a>
            <!-- end if {nav_page_first} -->
            <!-- if {nav_page_prev} -->
            <a class="fncc-btn fncc-btn--sm" href="{link}" title="{i18n:Previous page}">&lsaquo;</a>
            <!-- end if {nav_page_prev} -->
            <!-- if {nav_page_next} -->
            <a class="fncc-btn fncc-btn--sm" href="{link}" title="{i18n:Next page}">&rsaquo;</a>
            <!-- end if {nav_page_next} -->
            <!-- if {nav_page_last} -->
            <a class="fncc-btn fncc-btn--sm" href="{link}" title="{i18n:Last page}">&raquo;</a>
            <!-- end if {nav_page_last} -->
        </nav>

        <div class="fncc-tablewrap">
            <table class="fncc-table fncc-table--stack">
                <thead>
                    <tr>
                        <!-- foreach {headers} -->
                        <th scope="col"><a href="{link}">{title}{arrow}</a></th>
                        <!-- end foreach {headers} -->
                        <!-- if {enableview} -->
                        <th scope="col">{i18n:View}</th>
                        <!-- end if {enableview} -->
                        <!-- if {enableedit} -->
                        <th scope="col">{i18n:Edit}</th>
                        <!-- end if {enableedit} -->
                        <!-- if {enabledelete} -->
                        <th scope="col">{i18n:Delete}</th>
                        <!-- end if {enabledelete} -->
                    </tr>
                </thead>
                <tbody>
                    <!-- foreach {rows} -->
                    <tr>
                        <!-- foreach {cols} -->
                        <td data-label="{fieldtitle}">{fieldvalue}</td>
                        <!-- end foreach {cols} -->
                        <!-- if {action_view} -->
                        <td data-label="{i18n:View}"><a class="fncc-btn fncc-btn--quiet fncc-btn--icon" href="{link}" title="{text}"><span aria-hidden="true">&#x1F50D;</span><span class="fncc-visually-hidden">{text}</span></a></td>
                        <!-- end if {action_view} -->
                        <!-- if {action_edit} -->
                        <td data-label="{i18n:Edit}"><a class="fncc-btn fncc-btn--quiet fncc-btn--icon" href="{link}" title="{text}"><span aria-hidden="true">&#x270E;</span><span class="fncc-visually-hidden">{text}</span></a></td>
                        <!-- end if {action_edit} -->
                        <!-- if {action_delete} -->
                        <td data-label="{i18n:Delete}"><a class="fncc-btn fncc-btn--quiet fncc-btn--icon fncc-btn--danger" href="{link}" title="{text}" data-fncc-confirm="{i18n:are you sure you want to delete this content?}"><span aria-hidden="true">&#x2715;</span><span class="fncc-visually-hidden">{text}</span></a></td>
                        <!-- end if {action_delete} -->
                    </tr>
                    <!-- end foreach {rows} -->
                </tbody>
            </table>
        </div>
        <div id="customarea"></div>
    </div>
</section>
