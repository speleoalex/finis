<!-- inputattributes:class="form-control" -->
<!-- inputattributes select:class="form-select" -->
<!-- inputattributes checkbox:class="form-check-input" -->
<!-- inputattributes button:class="btn btn-light btn-sm py-0 px-1" -->
<div class="card">
    <div class="card-body">
        <!-- if {message_saved} -->
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {message_saved}
        </div>
        <!-- end if {message_saved} -->
        <form method="post" action="{formaction}" class="">
            <!-- foreach {items} -->
            <div class="form-group row mb-2">
                <label class="col-sm-4 col-form-label" for="{id}">{title}:</label>
                <div class="col-sm-8">
                    {htmlinput}
                </div>
            </div>
            <!-- end foreach {items} -->
            <div class="form-group row">
                <div class="col-sm-6">
                    <button type="submit" class="btn btn-primary">{i18n:Save}</button>
                    <!-- if {linkcancel} -->
                    <a href="{linkcancel}" class="btn btn-secondary">{i18n:Cancel}</a>
                    <!-- end if {linkcancel} -->
                </div>
            </div>
        </form>
    </div>
</div>
